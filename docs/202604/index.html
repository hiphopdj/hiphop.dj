<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノンデリカレー</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        audio {
            width: 300px;
            margin-bottom: 16px;
        }
        .download-link {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        .download-link:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ノンデリカレー</h1>
        <audio controls autoplay>
            <source src="ノンデリカレー.mp3" type="audio/mpeg">
            お使いのブラウザはHTML5オーディオタグに対応していません。
        </audio>
        <div>
            <a class="download-link" href="ノンデリカレー.mp3" download>ダウンロード</a>
        </div>
    </div>
</body>
</html>
